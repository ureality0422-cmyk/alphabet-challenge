<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alphabet Challenge</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #111318;
    --panel: #1b1e25;
    --text: #f5f5f5;
    --muted: #9da3ad;
    --copper1: #b87333;
    --copper2: #e0a06b;
    --silver1: #8e939b;
    --silver2: #f2f3f5;
    --gold1: #c99600;
    --gold2: #ffe36e;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% 0%, #292d38 0%, var(--bg) 45%);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px;
  }

  .app {
    width: min(1100px, 100%);
  }

  h1 {
    text-align: center;
    margin: 0 0 8px;
    font-size: clamp(28px, 4vw, 46px);
    letter-spacing: .08em;
  }

  .subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .progress {
    background: var(--panel);
    border: 1px solid #30343d;
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 20px;
    text-align: center;
  }

  .progress-number {
    font-size: clamp(40px, 7vw, 72px);
    font-weight: 800;
    line-height: 1;
  }

  .progress-label {
    color: var(--muted);
    margin-top: 8px;
  }

  .progress-number.copper-text { color: #e0a06b; text-shadow: 0 0 18px rgba(184,115,51,.45); }
  .progress-number.silver-text { color: #f2f3f5; text-shadow: 0 0 18px rgba(220,225,235,.5); }
  .progress-number.gold-text { color: #ffe36e; text-shadow: 0 0 22px rgba(255,215,50,.65); }

  .bar {
    height: 12px;
    background: #30343d;
    border-radius: 99px;
    overflow: hidden;
    margin-top: 18px;
  }

  .bar-fill {
    width: 0%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #b87333, #d8dbe0, #ffd84d);
    transition: width .25s ease;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 22px;
    flex-wrap: wrap;
    margin-top: 15px;
    color: var(--muted);
  }

  .stats span {
    font-weight: 700;
  }

  .alphabet {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
  }

  button.letter {
    position: relative;
    min-height: 115px;
    border: 2px solid #353944;
    border-radius: 18px;
    background: #20232b;
    color: white;
    cursor: pointer;
    transition: transform .12s ease, filter .2s ease, box-shadow .2s ease;
    overflow: hidden;
  }

  button.letter:hover {
    filter: brightness(1.15);
    transform: translateY(-2px);
  }

  button.letter:active {
    transform: scale(.96);
  }

  .letter-name {
    display: block;
    font-size: clamp(30px, 4vw, 48px);
    font-weight: 900;
    line-height: 1;
  }

  .count {
    display: block;
    margin-top: 10px;
    font-size: 17px;
    font-weight: 700;
    opacity: .85;
  }

  .name-list {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px 14px;
  }

  .name-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid #30343d;
    border-radius: 12px;
    padding: 9px 12px;
  }

  .name-letter {
    width: 30px;
    text-align: center;
    font-weight: 900;
    font-size: 20px;
  }

  .name-input {
    width: 100%;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
  }

  .name-input::placeholder {
    color: #686e78;
  }

  .name-input:focus {
    border-bottom: 1px solid #777e89;
  }

  @media (max-width: 560px) {
    .name-list { grid-template-columns: 1fr; }
  }

  .copper {
    background: linear-gradient(145deg, var(--copper1), #7f431d 55%, var(--copper2)) !important;
    border-color: #e0a06b !important;
    box-shadow: 0 0 18px rgba(184,115,51,.28);
  }

  .silver {
    background: linear-gradient(145deg, var(--silver1), #5e626a 55%, var(--silver2)) !important;
    border-color: #f2f3f5 !important;
    color: #17191d !important;
    box-shadow: 0 0 22px rgba(220,225,235,.32);
  }

  .gold {
    background: linear-gradient(145deg, var(--gold1), #9c6c00 48%, var(--gold2)) !important;
    border-color: #ffe36e !important;
    color: #251b00 !important;
    box-shadow: 0 0 28px rgba(255,215,50,.48);
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 22px;
    flex-wrap: wrap;
  }

  .control {
    border: 1px solid #454a55;
    background: #242832;
    color: white;
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .control:hover { background: #303541; }

  .reset {
    border-color: #713d3d;
    color: #ffb5b5;
  }

  .hint {
    text-align: center;
    color: #777d88;
    margin-top: 18px;
    font-size: 13px;
  }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.72);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    z-index: 10;
  }

  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .achievement {
    text-align: center;
    padding: 45px 60px;
    border-radius: 30px;
    background: linear-gradient(145deg, #252831, #111318);
    border: 2px solid #ffe36e;
    box-shadow: 0 0 70px rgba(255,215,50,.35);
    transform: scale(.8);
    transition: transform .25s ease;
  }

  .overlay.show .achievement { transform: scale(1); }

  .achievement-medal {
    font-size: 80px;
  }

  .achievement h2 {
    font-size: clamp(30px, 6vw, 64px);
    margin: 10px 0;
  }

  .achievement p {
    color: #c5c9d0;
    margin: 0;
  }


  .name-modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.72);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:30}
  .name-modal.show{opacity:1;pointer-events:auto}
  .name-dialog{width:min(440px,100%);background:#1b1e25;border:1px solid #454a55;border-radius:22px;padding:26px;box-shadow:0 20px 70px rgba(0,0,0,.5)}
  .name-dialog h2{margin:0 0 6px;font-size:26px}
  .name-dialog p{margin:0 0 18px;color:#9da3ad}
  .selected-letter{color:#ffe36e;font-weight:900}
  .name-dialog input{width:100%;border:1px solid #4a505b;background:#111318;color:white;border-radius:12px;padding:14px;font-size:18px;outline:none}
  .name-dialog input:focus{border-color:#8b929e}
  .modal-buttons{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .name-dialog .modal-button{border:1px solid #454a55;background:#292d36;color:white;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer}
  .name-dialog .modal-button.primary{background:#f0c52b;color:#211900;border-color:#ffe36e}
  .saved-names{margin-top:8px;color:#9da3ad;font-size:13px;line-height:1.6;max-height:100px;overflow-y:auto}
  .confetti{position:fixed;top:-30px;width:9px;height:14px;z-index:25;pointer-events:none;animation:confetti-fall linear forwards}
  @keyframes confetti-fall{0%{transform:translate3d(0,-20px,0) rotate(0deg);opacity:1}100%{transform:translate3d(var(--drift),110vh,0) rotate(720deg);opacity:0}}

  @media (max-width: 800px) {
    .alphabet { grid-template-columns: repeat(5, 1fr); }
    button.letter { min-height: 100px; }
  }

  @media (max-width: 560px) {
    body { padding: 15px; }
    .alphabet { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    button.letter { min-height: 90px; border-radius: 13px; }
  }

  /* 金・銀の文字を画像書き出しでも読みやすくする */
  .letter.silver .letter-name, .letter.silver .count {
    color: #ffffff !important;
    text-shadow: 0 2px 3px rgba(0,0,0,.75), 0 0 2px rgba(0,0,0,.55);
    font-weight: 800;
  }
  .letter.gold .letter-name, .letter.gold .count {
    color: #241800 !important;
    text-shadow: 0 1px 2px rgba(255,255,255,.45);
    font-weight: 900;
  }
  .saved-name-row { display:flex; align-items:center; gap:8px; margin:4px 0; }
  .saved-name-delete { border:0; border-radius:8px; padding:3px 8px; cursor:pointer; background:#8b3030; color:#fff; font-weight:700; }

</style>
</head>
<body>
<audio id="achievementSound" src="きらーん2.mp3" preload="auto"></audio>
<main class="app">
  <h1>ALPHABET CHALLENGE</h1>
  <div class="subtitle">リスナーの名前の頭文字を集めよう</div>

  <section class="progress">
    <div class="progress-number" id="progressNumber"><span id="uniqueCount">0</span> / 26</div>
    <div class="progress-label">集めたアルファベット</div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="stats">
      <div>1回目 <span id="copperCount">0</span> / 26</div>
      <div>2回目 <span id="silverCount">0</span> / 26</div>
      <div>3回目 <span id="goldCount">0</span> / 26</div>
      <div>合計 <span id="totalCount">0</span> 回</div>
    </div>
  </section>

  <section class="alphabet" id="alphabet"></section>

  <section class="name-list" id="nameList"></section>

  <div class="controls">
    <button class="control" id="minusMode">減らすモード：OFF</button>
    <button class="control" id="saveButton">保存</button>
    <button class="control reset" id="resetButton">全リセット</button>
  </div>

  <div class="share-tools" style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
    <button class="control" id="copyShareButton">データをコピー</button>
    <button class="control" id="importShareButton">データを読み込む</button>
  </div>

  <div class="hint">
    通常：クリックで +1　／　減らすモード：クリックで -1　／　キーボード A〜Z でも加算
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="achievement">
    <h2 id="achievementTitle">全アルファベット達成！</h2>
    <p id="achievementText">26文字すべて集まりました</p>
  </div>
</div>


<!-- 名前入力ポップアップ -->
<div class="name-modal" id="nameModal">
  <div class="name-dialog">
    <h2>名前を追加</h2>
    <p><span class="selected-letter" id="selectedLetter">A</span> の名前を入力してください</p>
    <input id="nameInput" type="text" placeholder="名前を入力">
    <div class="saved-names" id="savedNames"></div>
    <div class="modal-buttons">
      <button type="button" class="modal-button" id="cancelNameButton">キャンセル</button>
      <button type="button" class="modal-button primary" id="saveNameButton">追加</button>
    </div>
  </div>
</div>

<script>
const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const storageKey = "alphabetChallengeCounts";
const namesStorageKey = "alphabetChallengeNames";

let counts = JSON.parse(localStorage.getItem(storageKey) || "{}");
let names = JSON.parse(localStorage.getItem(namesStorageKey) || "{}");
let minusMode = false;
let achievementLevel = 0;
let selectedLetter = null;

letters.forEach(letter => {
  if (!Number.isFinite(counts[letter])) counts[letter] = 0;
  if (typeof names[letter] === "string") names[letter] = names[letter] ? [names[letter]] : [];
  if (!Array.isArray(names[letter])) names[letter] = [];
});

const alphabetElement = document.getElementById("alphabet");
const uniqueCountElement = document.getElementById("uniqueCount");
const copperCountElement = document.getElementById("copperCount");
const silverCountElement = document.getElementById("silverCount");
const goldCountElement = document.getElementById("goldCount");
const totalCountElement = document.getElementById("totalCount");
const barFillElement = document.getElementById("barFill");
const overlayElement = document.getElementById("overlay");

function save() {
  localStorage.setItem(storageKey, JSON.stringify(counts));
  localStorage.setItem(namesStorageKey, JSON.stringify(names));
}

function getLevel(count) {
  if (count >= 3) return "gold";
  if (count >= 2) return "silver";
  if (count >= 1) return "copper";
  return "";
}

function render() {
  alphabetElement.innerHTML = "";

  letters.forEach(letter => {
    const button = document.createElement("button");
    button.className = "letter";

    const level = getLevel(counts[letter]);
    if (level) button.classList.add(level);

    button.innerHTML = `
        <span class="letter-name">${letter}</span>
      <span class="count">${counts[letter]}回</span>
    `;

    button.addEventListener("click", () => changeCount(letter));
    alphabetElement.appendChild(button);
  });

  updateStats();
  renderNames();
}

function changeCount(letter) {
  if (minusMode) {
    counts[letter] = Math.max(0, counts[letter] - 1);
    save();
    render();
    syncAchievementLevel();
    return;
  }

  counts[letter] += 1;
  save();
  render();
  openNameModal(letter);
}

function renderNames() {
  const nameListElement = document.getElementById("nameList");
  nameListElement.innerHTML = "";

  letters.forEach(letter => {
    const item = document.createElement("div");
    item.className = "name-item";

    const label = document.createElement("div");
    label.className = "name-letter";
    label.textContent = letter;

    const input = document.createElement("input");
    input.className = "name-input";
    input.type = "text";
    input.readOnly = true;
    input.placeholder = "アルファベットを押して追加";
    input.value = names[letter].join("、");
    input.addEventListener("click", () => openNameModal(letter));

    item.appendChild(label);
    item.appendChild(input);
    nameListElement.appendChild(item);
  });
}

function openNameModal(letter) {
  selectedLetter = letter;
  document.getElementById("selectedLetter").textContent = letter;
  document.getElementById("nameInput").value = "";
  renderSavedNames();
  document.getElementById("nameModal").classList.add("show");
  setTimeout(() => document.getElementById("nameInput").focus(), 50);
}

function renderSavedNames() {
  const element = document.getElementById("savedNames");
  element.innerHTML = "";
  if (!selectedLetter || !names[selectedLetter].length) return;

  const title = document.createElement("div");
  title.textContent = "登録済み：";
  element.appendChild(title);

  names[selectedLetter].forEach((name, index) => {
    const row = document.createElement("div");
    row.className = "saved-name-row";

    const nameText = document.createElement("span");
    nameText.textContent = name;

    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.className = "saved-name-delete";
    deleteButton.textContent = "削除";
    deleteButton.addEventListener("click", (event) => {
      event.stopPropagation();
      names[selectedLetter].splice(index, 1);
      counts[selectedLetter] = Math.max(0, counts[selectedLetter] - 1);
      save();
      render();
      renderSavedNames();
      syncAchievementLevel();
    });

    row.appendChild(nameText);
    row.appendChild(deleteButton);
    element.appendChild(row);
  });
}

function closeNameModal() {
  document.getElementById("nameModal").classList.remove("show");
  selectedLetter = null;

  // 名前入力ポップアップを閉じた直後に達成判定する。
  // 26文字目を登録したタイミングでも確実に達成ポップアップを表示する。
  checkAchievement();
}

function addListenerName() {
  if (!selectedLetter) return;
  const name = document.getElementById("nameInput").value.trim();
  if (name) names[selectedLetter].push(name);
  save();
  closeNameModal();
  render();
}

function updateStats() {
  const unique = letters.filter(letter => counts[letter] >= 1).length;
  const copper = letters.filter(letter => counts[letter] >= 1).length;
  const silver = letters.filter(letter => counts[letter] >= 2).length;
  const gold = letters.filter(letter => counts[letter] >= 3).length;
  const total = letters.reduce((sum, letter) => sum + counts[letter], 0);

  uniqueCountElement.textContent = unique;
  copperCountElement.textContent = copper;
  silverCountElement.textContent = silver;
  goldCountElement.textContent = gold;
  totalCountElement.textContent = total;
  barFillElement.style.width = `${(unique / 26) * 100}%`;
  const progressNumber = document.getElementById("progressNumber");
  progressNumber.classList.remove("copper-text", "silver-text", "gold-text");
  if (unique === 26) {
    const minimumLevel = Math.min(...letters.map(letter => getLevelNumber(counts[letter])));
    if (minimumLevel >= 3) progressNumber.classList.add("gold-text");
    else if (minimumLevel >= 2) progressNumber.classList.add("silver-text");
    else progressNumber.classList.add("copper-text");
  }
}

function getLevelNumber(count) {
  return count >= 3 ? 3 : count >= 2 ? 2 : count >= 1 ? 1 : 0;
}

function syncAchievementLevel() {
  const copperComplete = letters.every(letter => counts[letter] >= 1);
  const silverComplete = letters.every(letter => counts[letter] >= 2);
  const goldComplete = letters.every(letter => counts[letter] >= 3);
  achievementLevel = goldComplete ? 3 : silverComplete ? 2 : copperComplete ? 1 : 0;
}

function checkAchievement() {
  const copperComplete = letters.every(letter => counts[letter] >= 1);
  const silverComplete = letters.every(letter => counts[letter] >= 2);
  const goldComplete = letters.every(letter => counts[letter] >= 3);

  let newLevel = 0;
  if (copperComplete) newLevel = 1;
  if (silverComplete) newLevel = 2;
  if (goldComplete) newLevel = 3;

  if (newLevel > achievementLevel) {
    achievementLevel = newLevel;
    showAchievement(newLevel);
  }
}

function showAchievement(level) {
  const title = level === 3 ? "ALL GOLD!" : level === 2 ? "ALL SILVER!" : "ALL COPPER!";
  const text = level === 3 ? "26文字すべてが金になりました！" :
               level === 2 ? "26文字すべてが銀になりました！" :
               "26文字すべてが銅になりました！";

  document.getElementById("achievementTitle").textContent = title;
  document.getElementById("achievementText").textContent = text;
  overlayElement.classList.add("show");
  playAchievementSound();
  createConfetti(level);

  setTimeout(() => overlayElement.classList.remove("show"), 2800);
}

function playAchievementSound() {
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return;
  const audioContext = new AudioContext();
  [523.25, 659.25, 783.99, 1046.5].forEach((frequency, index) => {
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    oscillator.type = "sine";
    oscillator.frequency.value = frequency;
    const start = audioContext.currentTime + index * 0.11;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.16, start + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.28);
    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start(start);
    oscillator.stop(start + 0.3);
  });
  setTimeout(() => audioContext.close(), 900);
}

function createConfetti(level) {
  const count = level === 3 ? 100 : 70;
  for (let i = 0; i < count; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti";
    piece.style.background = `hsl(${Math.floor(Math.random() * 360)}, 85%, 65%)`;
    piece.style.left = `${Math.random() * 100}vw`;
    piece.style.setProperty("--drift", `${(Math.random() - 0.5) * 260}px`);
    piece.style.animationDuration = `${2.2 + Math.random() * 2.2}s`;
    piece.style.animationDelay = `${Math.random() * 0.4}s`;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 5000);
  }
}
document.getElementById("minusMode").addEventListener("click", event => {
  minusMode = !minusMode;
  event.target.textContent = `減らすモード：${minusMode ? "ON" : "OFF"}`;
});

document.getElementById("saveButton").addEventListener("click", () => {
  save();
});

document.getElementById("copyShareButton").addEventListener("click", copyShareData);
document.getElementById("importShareButton").addEventListener("click", importShareData);

document.getElementById("resetButton").addEventListener("click", () => {
  if (!confirm("カウントをすべて0にしますか？")) return;

  letters.forEach(letter => {
    counts[letter] = 0;
    names[letter] = [];
  });
  achievementLevel = 0;
  save();
  render();
});

document.getElementById("saveNameButton").addEventListener("click", addListenerName);
document.getElementById("cancelNameButton").addEventListener("click", closeNameModal);
document.getElementById("nameInput").addEventListener("keydown", event => {
  if (event.key === "Enter") addListenerName();
  if (event.key === "Escape") closeNameModal();
});
document.getElementById("nameModal").addEventListener("click", event => {
  if (event.target.id === "nameModal") closeNameModal();
});

overlayElement.addEventListener("click", () => {
  overlayElement.classList.remove("show");
});

document.addEventListener("keydown", event => {
  const activeElement = document.activeElement;

  // 名前入力中は A〜Z のキー入力でカウントしない
  if (activeElement && activeElement.id === "nameInput") return;

  const letter = event.key.toUpperCase();

  if (letters.includes(letter)) {
    changeCount(letter);
  }
});

render();


// ===== 共有データ =====
// 現在の回数・名前を、相手に送れる1本の文字列にまとめます。
function createShareData() {
  const shareData = {
    type: "alphabet-challenge",
    version: 1,
    counts: {},
    names: {}
  };

  letters.forEach(letter => {
    shareData.counts[letter] = counts[letter] || 0;
    shareData.names[letter] = Array.isArray(names[letter]) ? [...names[letter]] : [];
  });

  return shareData;
}

function encodeShareData() {
  const json = JSON.stringify(createShareData());
  return btoa(unescape(encodeURIComponent(json)));
}

function decodeShareData(text) {
  const json = decodeURIComponent(escape(atob(text.trim())));
  const data = JSON.parse(json);

  if (!data || data.type !== "alphabet-challenge" || data.version !== 1) {
    throw new Error("対応していない共有データです。");
  }

  return data;
}

async function copyShareData() {
  const shareText = encodeShareData();

  try {
    await navigator.clipboard.writeText(shareText);
    alert("共有データをコピーしました。\nDiscordやLINEなどで相手に送ってください。");
  } catch (error) {
    window.prompt("下の共有データをコピーして相手に送ってください。", shareText);
  }
}

function importShareData() {
  const shareText = window.prompt("相手から受け取った共有データを貼り付けてください。");
  if (!shareText) return;

  try {
    const data = decodeShareData(shareText);

    letters.forEach(letter => {
      const count = Number(data.counts?.[letter]);
      counts[letter] = Number.isFinite(count) ? Math.max(0, Math.floor(count)) : 0;

      const importedNames = data.names?.[letter];
      names[letter] = Array.isArray(importedNames)
        ? importedNames.filter(name => typeof name === "string")
        : [];
    });

    achievementLevel = 0;
    save();
    render();
    checkAchievement();
    alert("共有データを読み込みました。");
  } catch (error) {
    alert("共有データを読み込めませんでした。\nコピーしたデータが全部入っているか確認してください。");
  }
}

</script>
