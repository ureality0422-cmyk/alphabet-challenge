<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alphabet Challenge</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #111318;
    --panel: #1b1e25;
    --text: #f5f5f5;
    --muted: #9da3ad;
    --copper1: #b87333;
    --copper2: #e0a06b;
    --silver1: #8e939b;
    --silver2: #f2f3f5;
    --gold1: #c99600;
    --gold2: #ffe36e;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% 0%, #292d38 0%, var(--bg) 45%);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px;
  }

  .app {
    width: min(1100px, 100%);
  }

  h1 {
    text-align: center;
    margin: 0 0 8px;
    font-size: clamp(28px, 4vw, 46px);
    letter-spacing: .08em;
  }

  .subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .progress {
    background: var(--panel);
    border: 1px solid #30343d;
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 20px;
    text-align: center;
  }

  .progress-number {
    font-size: clamp(40px, 7vw, 72px);
    font-weight: 800;
    line-height: 1;
  }

  .progress-label {
    color: var(--muted);
    margin-top: 8px;
  }

  .progress-number.copper-text { color: #e0a06b; text-shadow: 0 0 18px rgba(184,115,51,.45); }
  .progress-number.silver-text { color: #f2f3f5; text-shadow: 0 0 18px rgba(220,225,235,.5); }
  .progress-number.gold-text { color: #ffe36e; text-shadow: 0 0 22px rgba(255,215,50,.65); }

  .bar {
    height: 12px;
    background: #30343d;
    border-radius: 99px;
    overflow: hidden;
    margin-top: 18px;
  }

  .bar-fill {
    width: 0%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #b87333, #d8dbe0, #ffd84d);
    transition: width .25s ease;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 22px;
    flex-wrap: wrap;
    margin-top: 15px;
    color: var(--muted);
  }

  .stats span {
    font-weight: 700;
  }

  .alphabet {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
  }

  button.letter {
    position: relative;
    min-height: 115px;
    border: 2px solid #353944;
    border-radius: 18px;
    background: #20232b;
    color: white;
    cursor: pointer;
    transition: transform .12s ease, filter .2s ease, box-shadow .2s ease;
    overflow: hidden;
  }

  button.letter:hover {
    filter: brightness(1.15);
    transform: translateY(-2px);
  }

  button.letter:active {
    transform: scale(.96);
  }

  .letter-name {
    display: block;
    font-size: clamp(30px, 4vw, 48px);
    font-weight: 900;
    line-height: 1;
  }

  .count {
    display: block;
    margin-top: 10px;
    font-size: 17px;
    font-weight: 700;
    opacity: .85;
  }

  .name-list {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px 14px;
  }

  .name-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid #30343d;
    border-radius: 12px;
    padding: 9px 12px;
  }

  .name-letter {
    width: 30px;
    text-align: center;
    font-weight: 900;
    font-size: 20px;
  }

  .name-input {
    width: 100%;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
  }

  .name-input::placeholder {
    color: #686e78;
  }

  .name-input:focus {
    border-bottom: 1px solid #777e89;
  }

  @media (max-width: 560px) {
    .name-list { grid-template-columns: 1fr; }
  }

  .copper {
    background: linear-gradient(145deg, var(--copper1), #7f431d 55%, var(--copper2)) !important;
    border-color: #e0a06b !important;
    box-shadow: 0 0 18px rgba(184,115,51,.28);
  }

  .silver {
    background: linear-gradient(145deg, var(--silver1), #5e626a 55%, var(--silver2)) !important;
    border-color: #f2f3f5 !important;
    color: #17191d !important;
    box-shadow: 0 0 22px rgba(220,225,235,.32);
  }

  .gold {
    background: linear-gradient(145deg, var(--gold1), #9c6c00 48%, var(--gold2)) !important;
    border-color: #ffe36e !important;
    color: #251b00 !important;
    box-shadow: 0 0 28px rgba(255,215,50,.48);
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 22px;
    flex-wrap: wrap;
  }

  .control {
    border: 1px solid #454a55;
    background: #242832;
    color: white;
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .control:hover { background: #303541; }

  .reset {
    border-color: #713d3d;
    color: #ffb5b5;
  }

  .hint {
    text-align: center;
    color: #777d88;
    margin-top: 18px;
    font-size: 13px;
  }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.72);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    z-index: 10;
  }

  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .achievement {
    text-align: center;
    padding: 45px 60px;
    border-radius: 30px;
    background: linear-gradient(145deg, #252831, #111318);
    border: 2px solid #ffe36e;
    box-shadow: 0 0 70px rgba(255,215,50,.35);
    transform: scale(.8);
    transition: transform .25s ease;
  }

  .overlay.show .achievement { transform: scale(1); }

  .achievement-medal {
    font-size: 80px;
  }

  .achievement h2 {
    font-size: clamp(30px, 6vw, 64px);
    margin: 10px 0;
  }

  .achievement p {
    color: #c5c9d0;
    margin: 0;
  }


  .name-modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.72);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:30}
  .name-modal.show{opacity:1;pointer-events:auto}
  .name-dialog{width:min(440px,100%);background:#1b1e25;border:1px solid #454a55;border-radius:22px;padding:26px;box-shadow:0 20px 70px rgba(0,0,0,.5)}
  .name-dialog h2{margin:0 0 6px;font-size:26px}
  .name-dialog p{margin:0 0 18px;color:#9da3ad}
  .selected-letter{color:#ffe36e;font-weight:900}
  .name-dialog input{width:100%;border:1px solid #4a505b;background:#111318;color:white;border-radius:12px;padding:14px;font-size:18px;outline:none}
  .name-dialog input:focus{border-color:#8b929e}
  .modal-buttons{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .name-dialog .modal-button{border:1px solid #454a55;background:#292d36;color:white;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer}
  .name-dialog .modal-button.primary{background:#f0c52b;color:#211900;border-color:#ffe36e}
  .saved-names{margin-top:8px;color:#9da3ad;font-size:13px;line-height:1.6;max-height:100px;overflow-y:auto}
  .confetti{position:fixed;top:-30px;width:9px;height:14px;z-index:25;pointer-events:none;animation:confetti-fall linear forwards}
  @keyframes confetti-fall{0%{transform:translate3d(0,-20px,0) rotate(0deg);opacity:1}100%{transform:translate3d(var(--drift),110vh,0) rotate(720deg);opacity:0}}

  @media (max-width: 800px) {
    .alphabet { grid-template-columns: repeat(5, 1fr); }
    button.letter { min-height: 100px; }
  }

  @media (max-width: 560px) {
    body { padding: 15px; }
    .alphabet { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    button.letter { min-height: 90px; border-radius: 13px; }
  }

    #exportImageButton {
      background: #4f46e5;
      color: #fff;
    }

    #exportImageButton:hover {
      opacity: 0.9;
    }
</style>
</head>
<body>
<audio id="achievementSound" src="きらーん2.mp3" preload="auto"></audio>
<main class="app">
  <h1>ALPHABET CHALLENGE</h1>
  <div class="subtitle">リスナーの名前の頭文字を集めよう</div>

  <section class="progress">
    <div class="progress-number" id="progressNumber"><span id="uniqueCount">0</span> / 26</div>
    <div class="progress-label">集めたアルファベット</div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="stats">
      <div>1回目 <span id="copperCount">0</span> / 26</div>
      <div>2回目 <span id="silverCount">0</span> / 26</div>
      <div>3回目 <span id="goldCount">0</span> / 26</div>
      <div>合計 <span id="totalCount">0</span> 回</div>
    </div>
  </section>

  <section class="alphabet" id="alphabet"></section>

  <section class="name-list" id="nameList"></section>

  <div class="controls">
    <button class="control" id="minusMode">減らすモード：OFF</button>
    <button class="control" id="saveButton">保存</button>
    <button class="control" id="exportImageButton">画像で書き出す</button>
    <button class="control reset" id="resetButton">全リセット</button>
  </div>

  <div class="hint">
    通常：クリックで +1　／　減らすモード：クリックで -1　／　キーボード A〜Z でも加算
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="achievement">
    <h2 id="achievementTitle">全アルファベット達成！</h2>
    <p id="achievementText">26文字すべて集まりました</p>
  </div>
</div>


<div class="name-modal" id="nameModal">
  <div class="name-dialog">
    <h2><span class="selected-letter" id="selectedLetter">A</span> の人の名前</h2>
    <p>このアルファベットの人の名前を入力してください。</p>
    <input id="nameInput" type="text" placeholder="人の名前を入力">
    <div class="saved-names" id="savedNames"></div>
    <div class="modal-buttons">
      <button class="modal-button" id="cancelNameButton">キャンセル</button>
      <button class="modal-button primary" id="saveNameButton">追加</button>
    </div>
  </div>
</div>

<script>
const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const storageKey = "alphabetChallengeCounts";
const namesStorageKey = "alphabetChallengeNames";

let counts = {};
let names = {};
let minusMode = false;
let selectedLetter = null;

function loadData() {
  try {
    counts = JSON.parse(localStorage.getItem(storageKey) || "{}");
  } catch {
    counts = {};
  }

  try {
    names = JSON.parse(localStorage.getItem(namesStorageKey) || "{}");
  } catch {
    names = {};
  }

  letters.forEach(letter => {
    if (!Number.isFinite(counts[letter])) {
      counts[letter] = 0;
    }

    if (typeof names[letter] === "string") {
      names[letter] = names[letter] ? [names[letter]] : [];
    }

    if (!Array.isArray(names[letter])) {
      names[letter] = [];
    }
  });

  save();
}

const alphabetElement = document.getElementById("alphabet");
const uniqueCountElement = document.getElementById("uniqueCount");
const copperCountElement = document.getElementById("copperCount");
const silverCountElement = document.getElementById("silverCount");
const goldCountElement = document.getElementById("goldCount");
const totalCountElement = document.getElementById("totalCount");
const barFillElement = document.getElementById("barFill");

function save() {
  localStorage.setItem(storageKey, JSON.stringify(counts));
  localStorage.setItem(namesStorageKey, JSON.stringify(names));
}

function getLevel(count) {
  if (count >= 3) return "gold";
  if (count >= 2) return "silver";
  if (count >= 1) return "copper";
  return "";
}

function render() {
  alphabetElement.innerHTML = "";

  letters.forEach(letter => {
    const button = document.createElement("button");
    button.className = "letter";

    const level = getLevel(counts[letter]);
    if (level) {
      button.classList.add(level);
    }

    button.innerHTML = `
      <span class="letter-name">${letter}</span>
      <span class="count">${counts[letter]}回</span>
    `;

    button.addEventListener("click", () => changeCount(letter));
    alphabetElement.appendChild(button);
  });

  updateStats();
  renderNames();
}

function changeCount(letter) {
  if (minusMode) {
    counts[letter] = Math.max(0, counts[letter] - 1);
    save();
    render();
    return;
  }

  counts[letter] += 1;
  save();
  render();

  // アルファベットを押したら人名入力ポップアップを開く
  openNameModal(letter);
}

function renderNames() {
  const nameListElement = document.getElementById("nameList");
  nameListElement.innerHTML = "";

  letters.forEach(letter => {
    const item = document.createElement("div");
    item.className = "name-item";

    const label = document.createElement("div");
    label.className = "name-letter";
    label.textContent = letter;

    const input = document.createElement("input");
    input.className = "name-input";
    input.type = "text";
    input.readOnly = true;
    input.placeholder = "アルファベットを押して追加";
    input.value = names[letter].join("、");
    input.addEventListener("click", () => openNameModal(letter));

    item.appendChild(label);
    item.appendChild(input);
    nameListElement.appendChild(item);
  });
}

function openNameModal(letter) {
  selectedLetter = letter;
  document.getElementById("selectedLetter").textContent = letter;
  document.getElementById("nameInput").value = "";
  renderSavedNames();
  document.getElementById("nameModal").classList.add("show");

  setTimeout(() => {
    document.getElementById("nameInput").focus();
  }, 50);
}

function renderSavedNames() {
  const element = document.getElementById("savedNames");

  element.textContent =
    selectedLetter && names[selectedLetter].length
      ? "登録済み： " + names[selectedLetter].join("、")
      : "";
}

function closeNameModal() {
  document.getElementById("nameModal").classList.remove("show");
  selectedLetter = null;
}

function addListenerName() {
  if (!selectedLetter) return;

  const nameInput = document.getElementById("nameInput");
  const name = nameInput.value.trim();

  // 空白だけの場合は追加しない
  if (!name) {
    nameInput.focus();
    return;
  }

  names[selectedLetter].push(name);
  save();
  closeNameModal();
  render();
}

function updateStats() {
  const unique = letters.filter(letter => counts[letter] >= 1).length;
  const copper = letters.filter(letter => counts[letter] >= 1).length;
  const silver = letters.filter(letter => counts[letter] >= 2).length;
  const gold = letters.filter(letter => counts[letter] >= 3).length;
  const total = letters.reduce((sum, letter) => sum + counts[letter], 0);

  uniqueCountElement.textContent = unique;
  copperCountElement.textContent = copper;
  silverCountElement.textContent = silver;
  goldCountElement.textContent = gold;
  totalCountElement.textContent = total;

  barFillElement.style.width = `${(unique / 26) * 100}%`;

  const progressNumber = document.getElementById("progressNumber");
  progressNumber.classList.remove(
    "copper-text",
    "silver-text",
    "gold-text"
  );

  if (unique === 26) {
    const minimumLevel = Math.min(
      ...letters.map(letter => getLevelNumber(counts[letter]))
    );

    if (minimumLevel >= 3) {
      progressNumber.classList.add("gold-text");
    } else if (minimumLevel >= 2) {
      progressNumber.classList.add("silver-text");
    } else {
      progressNumber.classList.add("copper-text");
    }
  }
}

function getLevelNumber(count) {
  if (count >= 3) return 3;
  if (count >= 2) return 2;
  if (count >= 1) return 1;
  return 0;
}

function exportAlphabetImage() {
  const canvas = document.createElement("canvas");
  const context = canvas.getContext("2d");

  // アプリ画面に近いダークUIで画像を書き出す
  const canvasWidth = 1400;
  const sidePadding = 40;
  const cardGap = 16;
  const columns = 6;
  const cardWidth =
    (canvasWidth - sidePadding * 2 - cardGap * (columns - 1)) / columns;
  const cardHeight = 150;
  const cardRows = Math.ceil(letters.length / columns);
  const headerHeight = 330;
  const footerHeight = 70;

  canvas.width = canvasWidth;
  canvas.height =
    headerHeight + cardRows * cardHeight + (cardRows - 1) * cardGap + footerHeight;

  // 背景
  const backgroundGradient = context.createRadialGradient(
    canvasWidth / 2,
    0,
    50,
    canvasWidth / 2,
    0,
    900
  );
  backgroundGradient.addColorStop(0, "#292d38");
  backgroundGradient.addColorStop(0.5, "#151820");
  backgroundGradient.addColorStop(1, "#111318");
  context.fillStyle = backgroundGradient;
  context.fillRect(0, 0, canvas.width, canvas.height);

  const uniqueCount = letters.filter(letter => counts[letter] >= 1).length;
  const participantCount = letters.reduce((total, letter) => {
    return total + names[letter].length;
  }, 0);
  const totalCount = letters.reduce(
    (sum, letter) => sum + counts[letter],
    0
  );
  const isAchieved = letters.every(letter => counts[letter] >= 3);

  // 共通の角丸長方形
  function drawRoundRect(x, y, width, height, radius, fillStyle, strokeStyle, lineWidth = 1) {
    context.beginPath();
    context.roundRect(x, y, width, height, radius);
    context.fillStyle = fillStyle;
    context.fill();
    context.strokeStyle = strokeStyle;
    context.lineWidth = lineWidth;
    context.stroke();
  }

  // タイトル
  context.textAlign = "center";
  context.textBaseline = "alphabetic";
  context.fillStyle = "#f5f5f5";
  context.font = "900 52px system-ui, sans-serif";
  context.fillText("ALPHABET CHALLENGE", canvasWidth / 2, 62);

  context.fillStyle = "#9da3ad";
  context.font = "22px system-ui, sans-serif";
  context.fillText("リスナーの名前の頭文字を集めよう", canvasWidth / 2, 98);

  // 上部ステータスパネル
  const panelX = 40;
  const panelY = 125;
  const panelWidth = canvasWidth - 80;
  const panelHeight = 175;
  drawRoundRect(
    panelX,
    panelY,
    panelWidth,
    panelHeight,
    20,
    "rgba(27,30,37,0.92)",
    "#3a404c",
    2
  );

  const statCenters = [
    panelX + panelWidth * 0.16,
    panelX + panelWidth * 0.39,
    panelX + panelWidth * 0.62,
    panelX + panelWidth * 0.84
  ];

  const labels = ["集まった数", "参加者", "達成状況", "合計"];
  labels.forEach((label, index) => {
    context.fillStyle = "#9da3ad";
    context.font = "700 19px system-ui, sans-serif";
    context.fillText(label, statCenters[index], panelY + 35);
  });

  // 区切り線
  context.strokeStyle = "#3b414d";
  context.lineWidth = 1;
  [0.275, 0.505, 0.735].forEach(rate => {
    const x = panelX + panelWidth * rate;
    context.beginPath();
    context.moveTo(x, panelY + 20);
    context.lineTo(x, panelY + panelHeight - 20);
    context.stroke();
  });

  // 集まった数
  context.fillStyle = uniqueCount > 0 ? "#ffe36e" : "#f5f5f5";
  context.font = "900 46px system-ui, sans-serif";
  context.fillText(`${uniqueCount} / 26`, statCenters[0], panelY + 92);

  // 参加者
  context.fillStyle = "#f5f5f5";
  context.font = "900 40px system-ui, sans-serif";
  context.fillText(`${participantCount} 人`, statCenters[1], panelY + 92);

  // 達成状況
  context.fillStyle = isAchieved ? "#ffe36e" : "#ff9a78";
  context.font = "900 31px system-ui, sans-serif";
  context.fillText(
    isAchieved ? "達成！！" : "達成ならず...!!",
    statCenters[2],
    panelY + 92
  );

  // 合計
  context.fillStyle = "#f5f5f5";
  context.font = "900 40px system-ui, sans-serif";
  context.fillText(`${totalCount} 回`, statCenters[3], panelY + 92);

  // 進捗バー
  const barX = panelX + 30;
  const barY = panelY + 127;
  const barWidth = panelWidth - 60;
  const barHeight = 13;

  drawRoundRect(barX, barY, barWidth, barHeight, 99, "#30343d", "#30343d", 0);

  const progressWidth = barWidth * (uniqueCount / 26);
  if (progressWidth > 0) {
    const progressGradient = context.createLinearGradient(
      barX,
      barY,
      barX + barWidth,
      barY
    );
    progressGradient.addColorStop(0, "#b87333");
    progressGradient.addColorStop(0.5, "#d8dbe0");
    progressGradient.addColorStop(1, "#ffd84d");

    drawRoundRect(
      barX,
      barY,
      progressWidth,
      barHeight,
      99,
      progressGradient,
      progressGradient,
      0
    );
  }

  // アルファベットカード
  letters.forEach((letter, index) => {
    const column = index % columns;
    const row = Math.floor(index / columns);
    const x = sidePadding + column * (cardWidth + cardGap);
    const y = headerHeight + row * (cardHeight + cardGap);
    const count = counts[letter];
    const level = getLevel(count);
    const savedNames = names[letter];

    let cardBackground = "#1b1e25";
    let cardBorder = "#353944";
    let letterColor = "#8f96a3";
    let countColor = "#9da3ad";
    let shadowColor = null;

    if (level === "copper") {
      cardBackground = "linear-gradient(145deg, #b87333, #7f431d 55%, #e0a06b)";
      cardBorder = "#e0a06b";
      letterColor = "#fff1df";
      countColor = "#fff1df";
      shadowColor = "rgba(184,115,51,0.35)";
    } else if (level === "silver") {
      cardBackground = "linear-gradient(145deg, #8e939b, #5e626a 55%, #f2f3f5)";
      cardBorder = "#f2f3f5";
      letterColor = "#ffffff";
      countColor = "#ffffff";
      shadowColor = "rgba(220,225,235,0.38)";
    } else if (level === "gold") {
      cardBackground = "linear-gradient(145deg, #c99600, #9c6c00 48%, #ffe36e)";
      cardBorder = "#ffe36e";
      letterColor = "#fff8cf";
      countColor = "#fff8cf";
      shadowColor = "rgba(255,215,50,0.45)";
    }

    if (shadowColor) {
      context.shadowColor = shadowColor;
      context.shadowBlur = level === "gold" ? 22 : 16;
    } else {
      context.shadowColor = "transparent";
      context.shadowBlur = 0;
    }

    drawRoundRect(
      x,
      y,
      cardWidth,
      cardHeight,
      18,
      cardBackground,
      cardBorder,
      2
    );
    context.shadowColor = "transparent";
    context.shadowBlur = 0;

    // アルファベット
    context.textAlign = "center";
    context.fillStyle = letterColor;
    context.font = "900 50px system-ui, sans-serif";
    context.fillText(letter, x + cardWidth / 2, y + 58);

    // 回数
    context.fillStyle = countColor;
    context.font = "700 18px system-ui, sans-serif";
    context.fillText(`${count}回`, x + cardWidth / 2, y + 84);

    // 名前：参加者なしなら空白
    if (savedNames.length > 0) {
      const nameText = savedNames.join("・");
      let nameFontSize = 18;
      context.font = `700 ${nameFontSize}px system-ui, sans-serif`;

      while (
        nameFontSize > 12 &&
        context.measureText(nameText).width > cardWidth - 24
      ) {
        nameFontSize -= 1;
        context.font = `700 ${nameFontSize}px system-ui, sans-serif`;
      }

      context.fillStyle = level ? "#fffaf0" : "#c5c9d0";
      context.fillText(nameText, x + cardWidth / 2, y + 112);
    }

    // 3回以上ならカード内にも達成表示
    if (count >= 3) {
      context.fillStyle = "#fff8cf";
      context.font = "900 15px system-ui, sans-serif";
      context.fillText("達成！！", x + cardWidth / 2, y + 137);
    }
  });

  // フッター
  const footerY = canvas.height - 28;
  context.textAlign = "center";
  context.fillStyle = "#777d88";
  context.font = "14px system-ui, sans-serif";
  context.fillText(
    "※ 画像は現在の進行状況を表示しています。",
    canvasWidth / 2,
    footerY
  );

  // iPad / iPhoneでは共有メニューを優先
  // 「画像を保存」を選べば写真アプリへ保存できます。
  canvas.toBlob(async blob => {
    if (!blob) {
      alert("画像の作成に失敗しました。");
      return;
    }

    const file = new File([blob], "alphabet-challenge.png", {
      type: "image/png"
    });

    // Web Share API + ファイル共有に対応している端末
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          files: [file],
          title: "ALPHABET CHALLENGE"
        });
        return;
      } catch (error) {
        // 共有画面を閉じた場合などは何もしない
        if (error && error.name === "AbortError") {
          return;
        }
      }
    }

    // 共有に対応していない場合は従来のダウンロードに戻す
    const link = document.createElement("a");
    link.download = "alphabet-challenge.png";
    link.href = URL.createObjectURL(blob);
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  }, "image/png");
}

// 減らすモード
document.getElementById("minusMode").addEventListener("click", event => {
  minusMode = !minusMode;
  event.target.textContent =
    `減らすモード：${minusMode ? "ON" : "OFF"}`;
});

// 保存
document.getElementById("saveButton").addEventListener("click", () => {
  save();
});

// 画像で書き出す
document
  .getElementById("exportImageButton")
  .addEventListener("click", exportAlphabetImage);

// 全リセット
document.getElementById("resetButton").addEventListener("click", () => {
  if (!confirm("カウントをすべて0にしますか？")) return;

  letters.forEach(letter => {
    counts[letter] = 0;
    names[letter] = [];
  });

  save();
  render();
});

// 名前追加
document
  .getElementById("saveNameButton")
  .addEventListener("click", addListenerName);

// 名前キャンセル
document
  .getElementById("cancelNameButton")
  .addEventListener("click", closeNameModal);

// 名前入力
document
  .getElementById("nameInput")
  .addEventListener("keydown", event => {
    if (event.key === "Enter") {
      addListenerName();
    }

    if (event.key === "Escape") {
      closeNameModal();
    }
  });

// モーダル外をクリック
document
  .getElementById("nameModal")
  .addEventListener("click", event => {
    if (event.target.id === "nameModal") {
      closeNameModal();
    }
  });

// キーボード A～Z
document.addEventListener("keydown", event => {
  // 名前入力中はキーボード操作でカウントしない
  if (document.activeElement === document.getElementById("nameInput")) {
    return;
  }

  const letter = event.key.toUpperCase();

  if (letters.includes(letter)) {
    changeCount(letter);
  }
});

// 最初に保存データを読み込んで表示
loadData();
render();
</script>
